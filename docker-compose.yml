# Local stack. `docker compose up` brings up the whole app; `docker compose up -d postgres`
# alone backs `pnpm dev` (API + web run on the host). `docker compose` auto-loads .env.
name: dtg

x-db-url: &db-url
  DATABASE_URL: postgres://${POSTGRES_USER:-dtg}:${POSTGRES_PASSWORD:-dtg_local_dev_only}@postgres:5432/${POSTGRES_DB:-dtg}

services:
  postgres:
    # Pinned exact — ADR-0010 wants the Postgres version identical across local / test / staging /
    # prod. Debian (bookworm) base, not alpine: glibc collation matches what production Postgres
    # typically runs, and avoids musl/glibc index-collation drift if the base ever changes.
    # The Testcontainers test tier pins the same tag — keep in sync with packages/db/src/testing.ts.
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtg_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dtg}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-dtg}" -d "${POSTGRES_DB:-dtg}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits (ADR-0010 — never on app boot).
  migrate:
    build:
      context: .
      target: api
    working_dir: /app
    # `node`, not `pnpm` — corepack's pnpm isn't pre-fetched in the image, so a
    # `pnpm` call downloads it from npm at runtime. migrate.ts has no local
    # imports; drizzle-orm/postgres resolve from /app/node_modules. Matches
    # deploy/compose.yaml.
    command: ['node', 'packages/db/src/migrate.ts']
    environment: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      <<: *db-url
      API_PORT: ${API_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${API_PORT:-3000}/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      target: web
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # So `docker compose ps` can distinguish a healthy web from a starting one —
    # the e2e stack-reuse probe (e2e/run.ts) keys on it. Mirrors deploy/compose.yaml.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pgdata:
