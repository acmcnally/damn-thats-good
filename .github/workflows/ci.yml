name: CI

# Triggers: push to `main` (the run that publishes images) + all PRs.
# A branch with no open PR gets no CI by design — open a draft PR for feedback.
# workflow_dispatch: a manual "redeploy :latest to staging" lever (DAMN-28).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job id `verify` is the required-status-check context on `main`.
  # Renaming it — or converting it to a matrix — silently makes `main`
  # unmergeable (the required check stays "pending" forever).
  verify:
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner: the Testcontainers reaper is unnecessary and occasionally flaky here.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      # `verify` self-skips the Playwright tier (it runs in `e2e-staging`), so the
      # browser download on `pnpm install` would be pure waste on the required check.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Validates the Dockerfiles on every PR; publishes the two images on `main`.
  # `needs: verify` so a CI-caught regression never publishes `:latest`
  # (DAMN-28's staging auto-deploys that tag). Deliberately NOT a required
  # status check — a registry hiccup shouldn't block a green merge.
  build-images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api and web share the Dockerfile's base -> deps -> build chain. Building
      # them as two sequential steps in one job lets BuildKit reuse those stages
      # within the run. No cross-run layer cache: type=gha spends ~50s/run
      # exporting for ~25s of import saving at these image sizes (measured on
      # DAMN-27 PR #3), and this job is off the critical path anyway.
      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: false
          sbom: false

      - name: Metadata (web)
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: web
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          provenance: false
          sbom: false

  # Deploys the just-published images to staging (DAMN-28). Runs on `main`
  # (post-merge) or a manual dispatch — never on a PR (`github.ref` is
  # `refs/pull/N/merge` there). `needs: build-images` so a `main` deploy can't
  # race ahead of its images. NOT a required check — a deploy hiccup shouldn't
  # retro-block an already-merged commit; it surfaces as a red job on `main`.
  # The `staging` environment scopes TS_AUTHKEY/STAGING_HOST to this job and
  # (protection rule) restricts real deploys to the `main` branch.
  deploy-staging:
    needs: build-images
    # `main` only — for BOTH triggers. A workflow_dispatch from a feature branch
    # is skipped here (the `staging` environment's branch rule is the backstop).
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: staging
    permissions: {}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # queue deploys; never kill one mid-compose
    steps:
      - name: Join the tailnet (ephemeral tag:ci node)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy + verify on the box
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
          # push -> the commit's own images; manual dispatch -> :latest
          TAG: ${{ github.event_name == 'push' && format('sha-{0}', github.sha) || 'latest' }}
        run: |
          tailscale ssh "deploy@$STAGING_HOST" \
            "cd ~/dtg && git fetch --quiet origin main && git checkout --quiet --detach $DEPLOY_SHA && ./deploy/deploy.sh $TAG"

  # Runs the Playwright smoke test (workflow tier — ADR-0012) against the staging
  # deployment `deploy-staging` just produced. main-only, post-merge. NOT a
  # required status check: it is the per-commit signal DAMN-30's manual
  # promote-to-prod step gates on — gate on conclusion == success; a *skipped*
  # run (e.g. deploy-staging failed) is NOT a pass.
  #
  # The job id `e2e-staging` is an API contract — DAMN-30 reads its conclusion by
  # name via the Checks API. Renaming it silently breaks that gate (same footgun
  # as the `verify` job id).
  e2e-staging:
    needs: deploy-staging
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Scopes TS_OAUTH_* + STAGING_URL, and the branch rule backstops the `if:`.
    # Note: this is the 2nd `staging`-environment job per run (deploy-staging is
    # the 1st) — if required reviewers are ever added to that environment, each
    # `main` run will prompt for approval twice.
    environment: staging
    permissions:
      contents: read
    concurrency:
      # Same group as deploy-staging so a deploy and a smoke run never overlap on
      # the one staging box. Cross-merge ordering comes from the workflow-level
      # `main` serialisation, not this group. No deadlock — `needs` guarantees the
      # two never want the slot simultaneously.
      group: deploy-staging
      cancel-in-progress: false
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # the explicit install step owns the browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dtg/e2e exec playwright install --with-deps chromium

      - name: Join the tailnet (ephemeral tag:ci node)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # userspace vs kernel mode is all we need for the transport bring-up (see
      # the DAMN-29 design doc § Transport). NOT `tailscale status` — it prints
      # the tailnet name + host list, and CI logs on a public repo are public.
      - name: Tailnet mode
        run: ip link show tailscale0 && echo "kernel mode" || echo "no tailscale0 → userspace mode"

      - name: Smoke test against staging
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          # E2E_PROXY: set once the draft-PR loop confirms userspace mode + the proxy
          # address (e.g. socks5://localhost:1055). Unset = direct / kernel mode.
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::vars.STAGING_URL is not set for the 'staging' environment."
            echo "Add it (the tailscale serve HTTPS URL) — otherwise run.ts self-skips and this job falsely goes green."
            exit 1
          fi
          pnpm e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Only on failure — the HTML report / traces embed the staging URL, and
        # artifacts on a public repo are world-downloadable. A green run has
        # nothing to inspect anyway.
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
