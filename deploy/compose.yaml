# Deployment stack — staging and prod, byte-identical. Only deploy/.env and the
# host (LXC vs VM) differ. Pulls the SHA-tagged images CI publishes (DAMN-27);
# never builds. Driven by deploy/deploy.sh, not `docker compose up` directly.
#
# Dev is docker-compose.yml at the repo root — a separate file with `build:`.
name: dtg

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-dtg}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-dtg}
  NODE_ENV: production
  WORKOS_API_KEY: ${WORKOS_API_KEY:?set WORKOS_API_KEY in deploy/.env}
  WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:?set WORKOS_CLIENT_ID in deploy/.env}
  # Staging only — set to 1 in staging's deploy/.env, never in prod's (DAMN-1). Defaults
  # empty/falsy so a .env that never mentions it is safe by default. DAMN-30 tracks a
  # hard deploy.sh guard against this ever being 1 on prod regardless.
  E2E_AUTH_BYPASS: ${E2E_AUTH_BYPASS:-}

services:
  postgres:
    # Keep in sync with docker-compose.yml and packages/db/src/testing.ts.
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-dtg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-dtg}" -d "${POSTGRES_DB:-dtg}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migrator. Run explicitly by deploy.sh *before* api is recreated —
  # deliberately NOT in api's depends_on (the deploy script owns the ordering).
  # `node`, not `pnpm`: corepack's pnpm binary isn't in the runtime image, so a
  # `pnpm` invocation would pull it from npm on every deploy. migrate.ts has no
  # local imports; drizzle-orm/postgres resolve from /app/node_modules.
  migrate:
    image: ghcr.io/acmcnally/damn-thats-good-api:${TAG:-latest}
    working_dir: /app
    command: ['node', 'packages/db/src/migrate.ts']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/acmcnally/damn-thats-good-api:${TAG:-latest}
    environment:
      <<: *app-env
      API_PORT: ${API_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${API_PORT:-3000}/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: ghcr.io/acmcnally/damn-thats-good-web:${TAG:-latest}
    # Loopback by default — `tailscale serve` is the entry point. Set WEB_BIND=0.0.0.0
    # in deploy/.env to reach it from the LAN (e.g. mobile validation testing).
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pgdata:
    # Pinned so DAMN-31's restore drills target a known name. Prod sets its own.
    name: ${PG_VOLUME:-dtg_staging_pgdata}
